name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          STAGE=$(mktemp -d)
          cp -a packages/mcp-server/. "$STAGE/"
          cd "$STAGE"
          # strip scripts that can fail offline
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.scripts={}; p.private=false; p.publishConfig={access:"public"}; fs.writeFileSync("package.json", JSON.stringify(p,null,2));'
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          npm whoami
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "pack $NAME@$VER"
          npm pack
          TGZ=$(ls *.tgz | head -1)
          echo "publishing tarball $TGZ"
          npm publish "$TGZ" --access public
          echo "waiting registry"
          for i in $(seq 1 12); do
            if OUT=$(npm view "$NAME@$VER" version 2>/dev/null); then
              echo "readback $OUT"
              npm view "$NAME" version dist-tags
              exit 0
            fi
            sleep 5
          done
          # final attempt with curl
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' "https://registry.npmjs.org/$(node -p 'encodeURIComponent(require("./package.json").name)')")
          echo "registry http $code"
          head -c 300 /tmp/reg.json; echo
          if [ "$code" = "200" ]; then exit 0; fi
          exit 1
