name: release

# Publishes when packages/repomap/package.json carries a version that is not
# on npm yet, through the shared mcp-kit release workflow. Bump with
# `bun scripts/set-version.ts X.Y.Z` in a PR. npm trusted publishing trusts
# this file (SylphxAI/repomap, release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release_crates.py
      - scripts/test_release_crates.py
      - Cargo.toml
      - Cargo.lock
      - crates/**
  merge_group:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crate-packages:
    name: verify registry packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: python3 scripts/test_release_crates.py
      - name: Pack and build both crates with registry dependency constraints
        run: python3 scripts/release_crates.py check

  crates:
    # An owner enables this only after registry ownership and both trusted
    # publisher records have been confirmed. Landing this workflow publishes nothing.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CRATES_IO_PUBLISH_ENABLED == 'true'
    needs: crate-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - id: plan
        run: python3 scripts/release_crates.py plan
      - id: auth
        if: steps.plan.outputs.publish == 'true'
        # Trusted publishing (OIDC): the short-lived token comes from crates.io
        # for this exact workflow, repository and environment. sylphx-repomap
        # and sylphx-repomap-core already exist on crates.io, so no long-lived
        # token is used or needed here — a missing trusted publisher fails
        # loudly instead.
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish dependencies before dependents
        if: steps.plan.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/release_crates.py publish

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: SylphxAI/mcp-kit/.github/workflows/release.yml@ee5d7e5d9fd51422171e35c99c0c7a27ef2bb51f # mcp-kit #61
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      kit-ref: ee5d7e5d9fd51422171e35c99c0c7a27ef2bb51f # mcp-kit #61
      name: repomap
      cargo-package: sylphx-repomap
      npm-package: '@sylphx/repomap'
      mcp-name: io.github.SylphxAI/repomap
      alias-dirs: packages/aliases/spine packages/aliases/locus packages/aliases/coderag
      docker-image: ghcr.io/sylphxai/repomap
      major-tag: true
      mcpb: true
      mcpb-icon: docs/public/icon.png
      retired-mcp-names: io.github.SylphxAI/spine io.github.SylphxAI/locus
      retired-message: Merged into repomap. Use io.github.SylphxAI/repomap (npm @sylphx/repomap).
      smoke: |
        npx -y "@sylphx/repomap@$V" version
        npx -y "@sylphx/repomap@$V" map -C "$GITHUB_WORKSPACE" | head -20
        # Semantic search: downloads the embedding model on first use.
        npx -y "@sylphx/repomap@$V" search "rank files by how central they are" -C "$GITHUB_WORKSPACE" --json --limit 5 > search.json
        grep -q 'crates/repomap-core/src/graph.rs' search.json
        npx -y "@sylphx/repomap@$V" index "$GITHUB_WORKSPACE" | grep -q 'keywords + embeddings'
        npx -y "@sylphx/spine@$V" version

  # Use the digest-verified assets of the matching tagged release; no rebuild.
  wheels:
    needs: release
    if: ${{ !cancelled() && github.repository_visibility == 'public' && github.ref == 'refs/heads/main' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and smoke-test the platform wheels
        id: build
        uses: SylphxAI/mcp-kit/.github/actions/pypi-wheels@ee5d7e5d9fd51422171e35c99c0c7a27ef2bb51f # mcp-kit #61
        with:
          mode: build
          name: repomap
          pypi-name: sylphx-repomap
          package-json: packages/repomap/package.json
          summary: Local code graphs, search, call paths, and change impact for your codebase.
          homepage: https://sylphxai.github.io/repomap/
          source-url: https://github.com/SylphxAI/repomap
          license-expression: MIT
          smoke-command: repomap --version
      - name: Store the wheels for publishing
        if: steps.build.outputs.built == 'true'
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: put
          name: wheels
          path: dist
          retention-days: 3

  # PyPI trusts SylphxAI/repomap, release.yml, and the pypi environment.
  pypi:
    needs: wheels
    if: ${{ !cancelled() && github.repository_visibility == 'public' && github.ref == 'refs/heads/main' && needs.wheels.result == 'success' && needs.wheels.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packages/repomap/package.json
          sparse-checkout-cone-mode: false
      - name: Fetch the wheels for publishing
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: get
          name: wheels
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
      - name: Verify the published wheel set on PyPI
        uses: SylphxAI/mcp-kit/.github/actions/pypi-wheels@ee5d7e5d9fd51422171e35c99c0c7a27ef2bb51f # mcp-kit #61
        with:
          mode: verify
          name: repomap
          pypi-name: sylphx-repomap
          package-json: packages/repomap/package.json
