name: release

# Publishes when packages/repomap/package.json carries a version that is not
# on npm yet, through the shared mcp-kit release workflow. Bump with
# `bun scripts/set-version.ts X.Y.Z` in a PR. npm trusted publishing trusts
# this file (SylphxAI/repomap, release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release_crates.py
      - scripts/test_release_crates.py
      - Cargo.toml
      - Cargo.lock
      - crates/**
  merge_group:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crate-packages:
    name: verify registry packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: python3 scripts/test_release_crates.py
      - name: Pack and build both crates with registry dependency constraints
        run: python3 scripts/release_crates.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-packages
          path: target/registry-packages/*.crate
          if-no-files-found: error

  crates:
    # An owner enables this only after registry ownership and both trusted
    # publisher records have been confirmed. Landing this workflow publishes nothing.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CRATES_IO_PUBLISH_ENABLED == 'true'
    needs: crate-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - id: plan
        run: python3 scripts/release_crates.py plan
      - id: auth
        if: steps.plan.outputs.publish == 'true'
        # Trusted publishing (OIDC): the short-lived token comes from crates.io
        # for this exact workflow, repository and environment. sylphx-repomap
        # and sylphx-repomap-core already exist on crates.io, so no long-lived
        # token is used or needed here — a missing trusted publisher fails
        # loudly instead.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish dependencies before dependents
        if: steps.plan.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/release_crates.py publish

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: SylphxAI/mcp-kit/.github/workflows/release.yml@5da4b0376fbbfd114056ccfb888fb98cf202bba5 # v0
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      name: repomap
      cargo-package: sylphx-repomap
      npm-package: '@sylphx/repomap'
      mcp-name: io.github.SylphxAI/repomap
      alias-dirs: packages/aliases/spine packages/aliases/locus packages/aliases/coderag
      docker-image: ghcr.io/sylphxai/repomap
      major-tag: true
      mcpb: true
      mcpb-icon: docs/public/icon.png
      retired-mcp-names: io.github.SylphxAI/spine io.github.SylphxAI/locus
      retired-message: Merged into repomap. Use io.github.SylphxAI/repomap (npm @sylphx/repomap).
      smoke: |
        npx -y "@sylphx/repomap@$V" version
        npx -y "@sylphx/repomap@$V" map -C "$GITHUB_WORKSPACE" | head -20
        # Semantic search: downloads the embedding model on first use.
        npx -y "@sylphx/repomap@$V" search "rank files by how central they are" -C "$GITHUB_WORKSPACE" --json --limit 5 > search.json
        grep -q 'crates/repomap-core/src/graph.rs' search.json
        npx -y "@sylphx/repomap@$V" index "$GITHUB_WORKSPACE" | grep -q 'keywords + embeddings'
        npx -y "@sylphx/spine@$V" version
