name: Deprecate transitional npm id

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPRECATE_ARCHITECTURE_READER_MCP
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    if: ${{ inputs.confirm == 'DEPRECATE_ARCHITECTURE_READER_MCP' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: npm deprecate transitional package if present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          npm whoami
          MSG='Retired install CTA. Use brand-sole @sylphx/spine (bin: spine).'
          if npm view @sylphx/architecture-reader-mcp version >/dev/null 2>&1; then
            npm deprecate "@sylphx/architecture-reader-mcp" "$MSG"
            npm view @sylphx/architecture-reader-mcp version deprecated || true
          else
            echo "transitional id not on registry; nothing to deprecate"
          fi
          npm view @sylphx/spine version bin
