name: ci

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate release gate
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce owned CI runner profiles
        run: python3 .github/scripts/check-owned-runner-profiles.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate JSON manifests
        run: bun run validate

      - name: Validate Cargo workspace
        run: cargo metadata --format-version 1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build Rust engine
        run: bun run build:rust

      - name: Run Rust tests
        run: cargo test

      - name: Run MCP adapter tests
        run: bun test

      - name: Public benchmark proof
        run: bun run benchmark:public-proof

      - name: Release gate
        run: bun run benchmark:release-gate

      - name: Check whitespace errors
        run: git diff --check HEAD
