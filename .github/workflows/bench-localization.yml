name: bench-localization

# File localization on SWE-bench Verified: given the issue text, does `search`
# rank the files the fix touches near the top? Runs on free GitHub-hosted
# standard runners, sharded so no job nears the 6 hour limit. Results are
# uploaded as an artifact; bench/localization/README.md says how they land in
# the docs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (every 10th instance, 1 shard) or full (every instance)'
        type: choice
        options: [smoke, full]
        default: smoke
      manifest:
        description: 'manifest.json (SWE-bench Verified) or manifest-tune.json (tuning split)'
        default: manifest.json
      shards:
        description: 'Shards for the full run'
        default: '10'
      semble:
        description: 'Also run semble'
        type: boolean
        default: true
      skip:
        description: 'Methods to skip: keywords, bm25 (comma separated)'
        default: ''
      baseline_ref:
        description: 'Also run the binary built from this ref, as `main` (empty = no)'
        default: ''
      variants:
        description: 'JSON object {name: REPOMAP_TUNE string} of extra repomap runs'
        default: '{}'
  pull_request:
    paths: ['bench/localization/**', '.github/workflows/bench-localization.yml']

permissions:
  contents: read

env:
  SEMBLE_SHA: 24497845460960db1839c8485319df189a889225

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked --manifest-path crates/repomap/Cargo.toml --bin repomap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repomap-binary
          path: target/release/repomap
          retention-days: 3

  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      count: ${{ steps.p.outputs.count }}
      mode: ${{ steps.p.outputs.mode }}
      manifest: ${{ steps.p.outputs.manifest }}
      semble: ${{ steps.p.outputs.semble }}
      skip: ${{ steps.p.outputs.skip }}
      baseline_ref: ${{ steps.p.outputs.baseline_ref }}
      variants: ${{ steps.p.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_MANIFEST: ${{ github.event.inputs.manifest }}
          IN_SHARDS: ${{ github.event.inputs.shards }}
          IN_SEMBLE: ${{ github.event.inputs.semble }}
          IN_SKIP: ${{ github.event.inputs.skip }}
          IN_BASELINE: ${{ github.event.inputs.baseline_ref }}
          IN_VARIANTS: ${{ github.event.inputs.variants }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          e = os.environ
          if e["EVENT"] == "workflow_dispatch":
              c = {"mode": e["IN_MODE"], "manifest": e["IN_MANIFEST"], "shards": int(e["IN_SHARDS"] or 10), "semble": e["IN_SEMBLE"] != "false",
                   "skip": e["IN_SKIP"], "baseline_ref": e["IN_BASELINE"], "variants": json.loads(e["IN_VARIANTS"] or "{}")}
          else:
              # A pull request runs what bench/localization/run.json says, else a smoke run.
              c = {"mode": "smoke", "manifest": "manifest.json", "shards": 10, "semble": True, "skip": "", "baseline_ref": "", "variants": {}}
              if os.path.exists("bench/localization/run.json"):
                  c.update(json.load(open("bench/localization/run.json")))
          n = c["shards"] if c["mode"] == "full" else 1
          print(f"count={n}")
          print("shards=" + json.dumps(list(range(n))))
          print(f"mode={c['mode']}")
          print(f"manifest={c['manifest']}")
          print("semble=" + ("true" if c["semble"] else "false"))
          print(f"skip={c['skip']}")
          print(f"baseline_ref={c['baseline_ref']}")
          print("variants=" + json.dumps(c["variants"], separators=(",", ":")))
          PY

  build-baseline:
    needs: plan
    if: needs.plan.outputs.baseline_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.baseline_ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked --manifest-path crates/repomap/Cargo.toml --bin repomap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repomap-baseline
          path: target/release/repomap
          retention-days: 3

  run:
    needs: [build, plan, build-baseline]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.result == 'success' && needs.build-baseline.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repomap-binary
          path: bin
      - run: chmod +x bin/repomap && bin/repomap version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.plan.outputs.baseline_ref != ''
        with:
          name: repomap-baseline
          path: baseline
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/sylphx/models
          key: models-potion-code-16M-v2
      - run: bin/repomap model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the baselines
        run: |
          set -euo pipefail
          pip install -q rank_bm25 pyarrow
          if [ "${{ needs.plan.outputs.semble }}" = true ]; then
            pip install -q "semble @ git+https://github.com/MinishLab/semble@$SEMBLE_SHA"
          fi
      - name: Localize
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
        run: |
          set -euo pipefail
          extra=()
          [ "${{ needs.plan.outputs.mode }}" = full ] || extra+=(--smoke)
          [ "${{ needs.plan.outputs.semble }}" = true ] || extra+=(--no-semble)
          [ -z "${{ needs.plan.outputs.skip }}" ] || extra+=(--skip "${{ needs.plan.outputs.skip }}")
          if [ -n "${{ needs.plan.outputs.baseline_ref }}" ]; then chmod +x baseline/repomap; extra+=(--baseline baseline/repomap); fi
          printf '%s' "$VARIANTS" > variants.json
          [ "$VARIANTS" = '{}' ] || extra+=(--variants variants.json)
          python3 bench/localization/localize.py run bin/repomap bench/localization/${{ needs.plan.outputs.manifest }} /tmp/repos out/shard-${{ matrix.shard }}.json \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.count }} "${extra[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -n 400
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/

  summary:
    needs: [plan, run]
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: Merge
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
        run: |
          set -euo pipefail
          mkdir -p out
          extra=(--shards "${{ needs.plan.outputs.count }}")
          [ "${{ needs.plan.outputs.mode }}" = full ] || extra+=(--smoke)
          [ "${{ needs.plan.outputs.semble }}" = true ] || extra+=(--no-semble)
          [ -z "${{ needs.plan.outputs.skip }}" ] || extra+=(--skip "${{ needs.plan.outputs.skip }}")
          [ -z "${{ needs.plan.outputs.baseline_ref }}" ] || extra+=(--baseline planned)
          printf '%s' "$VARIANTS" > variants.json
          extra+=(--variants variants.json)
          python3 bench/localization/localize.py summarize bench/localization/${{ needs.plan.outputs.manifest }} out/localization.json shards/shard-*.json \
            --note "Run ${{ github.run_id }}, 4 vCPU \`ubuntu-latest\`." "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localization
          path: out/localization.json
