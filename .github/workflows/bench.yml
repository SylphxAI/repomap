name: bench

# Indexing and query benchmarks on large public repositories, on a
# GitHub-hosted runner. Results land in the job summary and an artifact.

on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/bench.py', '.github/workflows/bench.yml']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p repomap
      - name: Clone corpora
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus && cd /tmp/corpus
          clone() { git clone -q --depth 1 --branch "$2" "https://github.com/$1" "$(basename $1)"; }
          pids=()
          clone microsoft/vscode 1.104.0 & pids+=($!)
          clone rust-lang/rust-analyzer 2026-09-21 & pids+=($!)
          clone django/django 5.2.6 & pids+=($!)
          clone kubernetes/kubernetes v1.34.1 & pids+=($!)
          for p in "${pids[@]}"; do wait "$p"; done
          du -sh /tmp/corpus/*
      - name: Run
        run: python3 scripts/bench.py target/release/repomap /tmp/corpus bench.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
