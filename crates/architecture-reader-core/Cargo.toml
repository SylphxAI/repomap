[package]
name = "architecture-reader-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core architecture evidence graph engine for Architecture Reader MCP."

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
walkdir = "2.5"