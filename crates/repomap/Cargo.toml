[package]
name = "sylphx-repomap"
description = "A map of your codebase for AI agents: code graph, search, call paths and change impact, with an interactive graph UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "assets/**", "LICENSE"]

[[bin]]
name = "repomap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
repomap-core = { package = "sylphx-repomap-core", path = "../repomap-core", version = "1.9.0" }
serde_json = "1"
sylphx-mcp-kit = "0.7.3"
tiny_http = "0.12"
dirs = "6"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite"] }

# Release assets are published by the shared mcp-kit release workflow as
# repomap-<platform>.tar.gz (.zip on Windows) with the binary at the archive root.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/repomap-linux-x64-gnu.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/repomap-linux-arm64-gnu.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/repomap-darwin-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/repomap-darwin-x64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/repomap-win32-x64-msvc.zip"
pkg-fmt = "zip"
[dev-dependencies]
tempfile = "3"
