[package]
name = "repomap"
description = "A map of your codebase for AI agents: code graph, search, call paths and change impact, with an interactive graph UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "repomap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
repomap-core = { path = "../repomap-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sylphx-mcp-kit = { git = "https://github.com/SylphxAI/mcp-kit", tag = "v0.1.0" }
tiny_http = "0.12"
dirs = "6"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite"] }
