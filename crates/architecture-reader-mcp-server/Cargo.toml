[package]
name = "architecture-reader-mcp-server"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Rust-native MCP server for architecture-reader-mcp (rmcp)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spine-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
architecture-reader-core = { path = "../architecture-reader-core" }
rmcp = { version = "2.0.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }