[workspace]
members = ["crates/repomap-core", "crates/repomap"]
resolver = "2"

[workspace.package]
version = "1.9.0"
edition = "2021"
license = "MIT"
authors = ["SylphxAI"]
rust-version = "1.94"
readme = "README.md"
documentation = "https://sylphxai.github.io/repomap/"
keywords = ["code-graph", "mcp", "code-search", "ai-agents", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/SylphxAI/repomap"
homepage = "https://sylphxai.github.io/repomap/"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
